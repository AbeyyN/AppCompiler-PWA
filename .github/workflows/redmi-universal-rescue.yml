name: Redmi Universal Rescue
on:
  push:
    paths: ['.github/workflows/redmi-universal-rescue.yml']
  workflow_dispatch:
jobs:
  rescue:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Restore persistent Redmi runner fleet without sudo
        shell: bash
        run: |
          set -Eeuo pipefail
          export HOME=/home/abeyy
          test "$(hostname)" = redmi-build
          mkdir -p "$HOME/bin" "$HOME/logs/redmi-runners"
          current=''
          for d in "$HOME"/actions-runner/*; do
            [ -f "$d/.runner" ] || continue
            n=$(jq -r '.agentName // empty' "$d/.runner" 2>/dev/null || true)
            [ "$n" = "${RUNNER_NAME:-}" ] && current=$(basename "$d")
          done
          echo "RUNNER=${RUNNER_NAME:-unknown} CURRENT_DIR=$current"

          cat > "$HOME/bin/redmi-runner-supervisor.sh" <<'SH'
          #!/usr/bin/env bash
          set -u
          export HOME=/home/abeyy
          LOCK="$HOME/.redmi-runner-supervisor.lockdir"
          if ! mkdir "$LOCK" 2>/dev/null; then exit 0; fi
          trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT INT TERM
          mkdir -p "$HOME/logs/redmi-runners"
          dirs=(AppCompiler-PWA AppCompiler-PWA-01 OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT-light SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          while :; do
            for n in "${dirs[@]}"; do
              d="$HOME/actions-runner/$n"
              [ -f "$d/.runner" ] || continue
              if ! pgrep -f "$d/bin/[R]unner.Listener run" >/dev/null 2>&1; then
                (
                  cd "$d" || exit 1
                  exec env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI ./run.sh
                ) >>"$HOME/logs/redmi-runners/$n.log" 2>&1 </dev/null &
                disown || true
              fi
            done
            sleep 20
          done
          SH
          chmod 755 "$HOME/bin/redmi-runner-supervisor.sh"

          pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
          rm -f "$HOME/.redmi-runner-manager.lock" 2>/dev/null || true
          crontab -l 2>/dev/null | grep -v 'redmi-runner-manager.sh' | grep -v 'redmi-runner-supervisor.sh' > /tmp/redmi.cron || true
          printf '%s\n' '@reboot setsid -f env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI /home/abeyy/bin/redmi-runner-supervisor.sh >>/home/abeyy/logs/redmi-runner-supervisor.log 2>&1' >> /tmp/redmi.cron
          crontab /tmp/redmi.cron

          dirs=(AppCompiler-PWA AppCompiler-PWA-01 OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT-light SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          for n in "${dirs[@]}"; do
            d="$HOME/actions-runner/$n"
            [ -f "$d/.runner" ] || continue
            [ "$n" = "$current" ] && continue
            pkill -TERM -f "$d/bin/[R]unner.Listener run" 2>/dev/null || true
          done
          sleep 2
          rm -rf "$HOME/.redmi-runner-supervisor.lockdir" 2>/dev/null || true
          setsid -f env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI "$HOME/bin/redmi-runner-supervisor.sh" >>"$HOME/logs/redmi-runner-supervisor.log" 2>&1 </dev/null
          sleep 25
          echo '-- listeners after rescue --'
          pgrep -af '/home/abeyy/actions-runner/.*/bin/Runner.Listener run' || true
          count=$(pgrep -fc '/home/abeyy/actions-runner/.*/bin/Runner.Listener run' || true)
          echo "LISTENER_COUNT=$count"
          test "$count" -ge 9
          echo REDMI_USERSPACE_RESCUE=PASS
