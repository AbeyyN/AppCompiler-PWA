name: NAS CI Artifacts SMB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nas-ci-artifacts-smb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, linux, x64, fujitsu, pwa, central]
    timeout-minutes: 15
    steps:
      - name: Configure persistent OMV SMB share for CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          KEY=/home/abeyy/.ssh/fujitsu-build-home
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT='/srv/dev-disk-by-uuid-e93f7a21-4a78-4f73-997a-78c11f6c647d/CI-Artifacts'
          MNTREF='97b97daa-d413-4df6-9b6c-fd2c52464d5a'
          BACKUP="/etc/openmediavault/config.xml.bak-ci-artifacts-$(date +%Y%m%d-%H%M%S)"
          sudo -n cp /etc/openmediavault/config.xml "$BACKUP"
          rollback() {
            rc=$?
            echo "ERROR: CI-Artifacts SMB setup failed rc=$rc; restoring OMV config"
            sudo -n cp "$BACKUP" /etc/openmediavault/config.xml || true
            sudo -n omv-salt deploy run samba >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap rollback ERR

          sudo -n mkdir -p "$ROOT" "$ROOT/Apps/Android" "$ROOT/Apps/iOS" "$ROOT/Apps/PWA" "$ROOT/Packages" "$ROOT/OpenWrt"
          sudo -n chown abeyy:users "$ROOT" "$ROOT/Apps" "$ROOT/Packages" "$ROOT/OpenWrt"
          sudo -n chmod 2775 "$ROOT" "$ROOT/Apps" "$ROOT/Packages" "$ROOT/OpenWrt"
          for d in "$ROOT/Apps" "$ROOT/Packages" "$ROOT/OpenWrt"; do
            sudo -n chgrp -R users "$d"
            sudo -n chmod -R g+rwX "$d"
            if command -v setfacl >/dev/null 2>&1; then
              sudo -n setfacl -R -m u:abeyy:rwx,u:nzrl:rwx,g:users:rwx,m:rwx "$d"
              sudo -n find "$d" -type d -exec setfacl -m d:u:abeyy:rwx,d:u:nzrl:rwx,d:g:users:rwx,d:m:rwx '{}' '+'
            fi
          done

          sf_uuid="$(sudo -n omv-confdbadm read conf.system.sharedfolder | jq -r '.[] | select(.name=="CI-Artifacts") | .uuid' | head -1)"
          if [ -z "$sf_uuid" ]; then
            sf_uuid="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          fi
          jq -n --arg uuid "$sf_uuid" --arg mnt "$MNTREF" '{uuid:$uuid,name:"CI-Artifacts",comment:"AbeyyTechXy CI build artifacts - managed by Fujitsu compiler",mntentref:$mnt,reldirpath:"CI-Artifacts/",privileges:{privilege:[{type:"user",name:"abeyy",perms:7},{type:"user",name:"nzrl",perms:7},{type:"group",name:"users",perms:7}]}}' | sudo -n omv-confdbadm update conf.system.sharedfolder -
          test "$(sudo -n omv-confdbadm read conf.system.sharedfolder | jq -r --arg u "$sf_uuid" '.[] | select(.uuid==$u) | .name')" = 'CI-Artifacts'

          smb_uuid="$(sudo -n omv-confdbadm read conf.service.smb.share | jq -r --arg ref "$sf_uuid" '.[] | select(.sharedfolderref==$ref) | .uuid' | head -1)"
          if [ -z "$smb_uuid" ]; then
            smb_uuid="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          fi
          jq -n --arg uuid "$smb_uuid" --arg ref "$sf_uuid" '{uuid:$uuid,enable:true,sharedfolderref:$ref,comment:"AbeyyTechXy CI Artifacts",guest:"no",readonly:false,browseable:true,recyclebin:false,recyclemaxsize:0,recyclemaxage:0,hidedotfiles:true,inheritacls:false,inheritpermissions:false,easupport:true,storedosattributes:false,hostsallow:"",hostsdeny:"",audit:false,timemachine:false,transportencryption:false,extraoptions:"",followsymlinks:true,widelinks:false,timemachinemaxsize:""}' | sudo -n omv-confdbadm update conf.service.smb.share -
          test "$(sudo -n omv-confdbadm read conf.service.smb.share | jq -r --arg u "$smb_uuid" '.[] | select(.uuid==$u) | .sharedfolderref')" = "$sf_uuid"

          sudo -n omv-salt deploy run samba
          sudo -n testparm -s >/tmp/ci-artifacts-testparm.txt 2>&1
          grep -A20 '^\[CI-Artifacts\]' /tmp/ci-artifacts-testparm.txt
          systemctl is-active --quiet smbd
          test -d "$ROOT/OpenWrt/AbeyyWRT/latest"
          echo '--- SHARE READY ---'
          echo 'SMB share: CI-Artifacts'
          echo 'IP: 192.168.1.99'
          echo 'Hostname: rapsi-nas'
          echo "PATH=$ROOT"
          echo "OMV_SHARED_FOLDER_UUID=$sf_uuid"
          echo "OMV_SMB_SHARE_UUID=$smb_uuid"
          echo 'CI_ARTIFACTS_SMB_READY'
          trap - ERR
          REMOTE
