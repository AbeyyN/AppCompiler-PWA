name: NAS CI Artifacts SMB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nas-ci-artifacts-smb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, fujitsu, pwa, central]
    timeout-minutes: 10
    steps:
      - name: Inspect OMV create and deploy syntax
        shell: bash
        run: |
          set -euo pipefail
          KEY=/home/abeyy/.ssh/fujitsu-build-home
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99 'bash -s' <<'REMOTE'
          set +e
          echo '--- CREATE HELP ---'; sudo -n omv-confdbadm create --help 2>&1 | head -200
          echo '--- UPDATE HELP ---'; sudo -n omv-confdbadm update --help 2>&1 | head -200
          echo '--- DELETE HELP ---'; sudo -n omv-confdbadm delete --help 2>&1 | head -160
          echo '--- SALT DEPLOY HELP ---'; sudo -n omv-salt deploy --help 2>&1 | head -200
          echo '--- AVAILABLE SALT STATES ---'; sudo -n omv-salt deploy list 2>&1 | grep -Ei 'samba|shared|filesystem|folder' | head -100
          REMOTE
