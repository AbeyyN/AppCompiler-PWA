name: Harden Global NAS Hook Source v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-global-nas-hook-source-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: [self-hosted, linux, x64, fujitsu, pwa, central]
    timeout-minutes: 15
    steps:
      - name: Persist NAS-first hook in APK delivery installer
        shell: bash
        run: |
          set -euo pipefail
          GH=(env -u GH_TOKEN -u GITHUB_TOKEN gh)
          meta="$RUNNER_TEMP/meta.json"; src="$RUNNER_TEMP/source.yml"; repl="$RUNNER_TEMP/repl.txt"
          ok=0
          for n in 1 2 3 4 5; do
            if timeout 45s "${GH[@]}" api repos/AbeyyN/X7-Core-Academy/contents/.github/workflows/install-global-apk-delivery.yml?ref=main > "$meta"; then ok=1; break; fi
            sleep $((n*2))
          done
          test "$ok" -eq 1
          jq -r '.content' "$meta" | tr -d '\n' | base64 -d > "$src"
          sha="$(jq -r '.sha' "$meta")"
          printf '%s' '' | base64 -d > "$repl"
          python3 - "$src" "$repl" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); replacement=Path(sys.argv[2]).read_text(); s=p.read_text()
          pat=r'(?ms)^      - name: Install completed hook on every Fujitsu runner\n.*?(?=^      - name: Schedule safe runner reload)'
          if 'Install NAS-first completed hook on every Fujitsu runner' in s:
              ns=s
          else:
              ns,n=re.subn(pat,lambda _: replacement,s,count=1)
              if n != 1:
                  raise SystemExit(f'expected one old hook section, got {n}')
          p.write_text(ns)
          PY
          grep -q 'Install NAS-first completed hook on every Fujitsu runner' "$src"
          grep -q 'fujitsu-nas-artifact-store' "$src"
          python3 - "$src" <<'PY'
          import sys,yaml
          yaml.safe_load(open(sys.argv[1]))
          print('TARGET_YAML_PARSE_OK')
          PY
          b64="$(base64 -w0 "$src")"
          jq -n --arg message 'fix: preserve NAS-first hook in APK delivery installer' --arg content "$b64" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}' > "$RUNNER_TEMP/update.json"
          persisted=0
          for n in 1 2 3 4 5 6; do
            if timeout 60s "${GH[@]}" api --method PUT repos/AbeyyN/X7-Core-Academy/contents/.github/workflows/install-global-apk-delivery.yml --input "$RUNNER_TEMP/update.json" >/dev/null; then persisted=1; break; fi
            sleep $((n*3))
          done
          test "$persisted" -eq 1
          echo APK_INSTALLER_NAS_GUARD_PERSISTED

      - name: Audit all X7 hook writers
        shell: bash
        run: |
          set -euo pipefail
          GH=(env -u GH_TOKEN -u GITHUB_TOKEN gh)
          repo="$RUNNER_TEMP/x7-audit"; rm -rf "$repo"
          timeout 90s "${GH[@]}" repo clone AbeyyN/X7-Core-Academy "$repo" -- --depth 1 >/dev/null
          python3 - "$repo" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); writers=[]; bad=[]
          for base in (root/'.github/workflows',root/'infra'):
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if not p.is_file(): continue
                  s=p.read_text(errors='ignore')
                  if 'fujitsu-job-completed.sh' in s and 'cat >' in s:
                      rel=str(p.relative_to(root)); writers.append(rel)
                      if 'fujitsu-nas-artifact-store' not in s: bad.append(rel)
          print('HOOK_WRITERS='+','.join(writers))
          print('UNSAFE_WRITERS='+(','.join(bad) if bad else 'none'))
          if bad: raise SystemExit('unsafe hook writers: '+', '.join(bad))
          PY
          echo GLOBAL_HOOK_SOURCE_AUDIT_OK
