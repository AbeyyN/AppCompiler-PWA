name: Hermes 986 Final Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, redmi, pwa, central]
    timeout-minutes: 6
    steps:
      - name: Finalize safe CI Doctor config
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          chmod 700 "$HOME/.hermes"
          [ ! -f "$HOME/.hermes/.env" ] || chmod 600 "$HOME/.hermes/.env"
          [ ! -f "$HOME/.hermes/config.yaml" ] || chmod 600 "$HOME/.hermes/config.yaml"
          [ ! -f "$HOME/.hermes/auth.json" ] || chmod 600 "$HOME/.hermes/auth.json"
          policy="$HOME/hermes-workspaces/986-ci-doctor/.hermes.md"
          test -f "$policy"
          if ! grep -q '^## GitHub access$' "$policy"; then
            cat >> "$policy" <<'EOF'

          ## GitHub access
          - GitHub CLI (`gh`) is installed and authenticated on REDMI-BUILD.
          - Prefer `gh run list`, `gh run view`, `gh api`, and local git for CI diagnosis.
          - Reading repositories, workflow state, and logs is allowed by default.
          - Never print `gh auth token`, credential files, Authorization headers, environment secrets, or full process command lines that may contain credentials.
          - Repository writes, pushes, merges, releases, destructive actions, or workflow reruns that can publish/deploy require explicit human approval.
          EOF
          fi
          chmod 600 "$policy"
          timeout 60s hermes doctor --fix >/tmp/hermes-doctor-fix.out 2>&1 || true
          echo HERMES_POLICY_FINALIZED=1

      - name: Verify GitHub CI reads
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          echo "github_account=$(gh api /user --jq .login)"
          gh run list --repo AbeyyN/SK-Gong-Kapas --limit 2 \
            --json databaseId,name,status,conclusion \
            --jq '.[] | "run=\(.databaseId) name=\(.name) status=\(.status) conclusion=\(.conclusion // "")"'
          echo HERMES_GITHUB_READ_READY=1

      - name: Test Hermes model without tools
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          cd "$HOME/hermes-workspaces/986-ci-doctor"
          timeout 75s hermes chat -q 'Reply exactly HERMES_986_OK. Do not use tools.' > /tmp/hermes-smoke.out 2>&1
          rc=$?
          sed -E 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]*/\1[REDACTED]/g; s/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' /tmp/hermes-smoke.out | tail -n 30
          if grep -qi 'No inference provider configured' /tmp/hermes-smoke.out; then
            echo HERMES_MODEL_SMOKE=PROVIDER_NOT_CONFIGURED
          elif [ "$rc" -eq 0 ] && grep -qx 'HERMES_986_OK' /tmp/hermes-smoke.out; then
            echo HERMES_MODEL_SMOKE=PASS
          else
            echo "HERMES_MODEL_SMOKE=FAIL rc=$rc"
          fi
          exit 0
