name: Redmi Dashboard Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-dashboard-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, redmi]
    timeout-minutes: 15
    steps:
      - name: Checkout dashboard source
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Repair Raspi-owned animated live dashboard behind Caddy
        shell: bash
        run: |
          set -Eeuo pipefail
          export HOME=/home/abeyy
          KEY="$HOME/.ssh/redmi-build-home"
          test -r "$KEY"
          SSH=(ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99)
          SCP=(scp -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new)

          echo '=== 1. REDMI LIVE SOURCE ==='
          curl -fsS http://127.0.0.1:9862/health; echo
          curl -fsS http://127.0.0.1:9862/api/status | python3 -c 'import json,sys;d=json.load(sys.stdin);s=d.get("system",{});print(d.get("version"),d.get("summary"),"cpu",s.get("cpu_percent"),"history",len(d.get("history",[])))'

          echo '=== 2. GENERATE RICH REDMI UI FROM ORIGINAL FUJITSU DESIGN ==='
          python3 ops/prepare-redmi-dashboard.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/redmi-dashboard-index.html')
          s=p.read_text()
          old="let bar=document.createElement('div');bar.className='progressbar';bar.innerHTML=`<i style=\"width:${p}%\"></i>`;el.firstElementChild?.appendChild(bar)"
          new="let bar=el.querySelector('.progressbar');if(!bar){bar=document.createElement('div');bar.className='progressbar';el.firstElementChild?.appendChild(bar)}bar.innerHTML=`<i style=\"width:${p}%\"></i>`"
          s=s.replace(old,new)
          p.write_text(s)
          print('UI_BYTES',p.stat().st_size)
          PY
          for q in 'Redmi Build Command Center' 'Live Performance Timeline' 'Runner / Build History' 'setInterval(tick,1000)'; do grep -q "$q" /tmp/redmi-dashboard-index.html; done

          echo '=== 3. DEPLOY LOOPBACK BACKEND ON RASPI :19861 ==='
          "${SSH[@]}" 'mkdir -p /home/abeyy/redmi-dashboard /home/abeyy/backups/redmi-dashboard; cp -a /home/abeyy/redmi-dashboard/index.html /home/abeyy/backups/redmi-dashboard/index.html.$(date +%Y%m%d-%H%M%S) 2>/dev/null || true; cp -a /home/abeyy/redmi-dashboard/dashboard.py /home/abeyy/backups/redmi-dashboard/dashboard.py.$(date +%Y%m%d-%H%M%S) 2>/dev/null || true'
          "${SCP[@]}" /tmp/redmi-dashboard-index.html abeyy@192.168.1.99:/home/abeyy/redmi-dashboard/index.html
          "${SCP[@]}" ops/raspi-redmi-dashboard.py abeyy@192.168.1.99:/home/abeyy/redmi-dashboard/dashboard.py
          "${SSH[@]}" '
            set -e
            chmod 755 /home/abeyy/redmi-dashboard/dashboard.py
            sudo -n systemctl stop redmi-dashboard.service 2>/dev/null || true
            pkill -TERM -f "/home/abeyy/redmi-dashboard/[d]ashboard.py" 2>/dev/null || true
            sleep 1
            sudo -n tee /etc/systemd/system/redmi-dashboard.service >/dev/null <<"UNIT"
          [Unit]
          Description=986 Redmi Build Dashboard UI on Raspi
          After=network-online.target caddy.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=abeyy
          Group=abeyy
          WorkingDirectory=/home/abeyy/redmi-dashboard
          Environment=PYTHONUNBUFFERED=1
          ExecStart=/usr/bin/python3 /home/abeyy/redmi-dashboard/dashboard.py
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          UNIT
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable redmi-dashboard.service >/dev/null
            sudo -n systemctl restart redmi-dashboard.service
            for i in $(seq 1 20); do curl -fsS http://127.0.0.1:19861/health >/tmp/rd-health.json 2>/tmp/rd-health.err && break; sleep 1; done
            systemctl is-active redmi-dashboard.service
            echo -- loopback-health --; cat /tmp/rd-health.json; echo
            echo -- loopback-state --
            curl -fsS http://127.0.0.1:19861/api/status | python3 -c '\''import json,sys;d=json.load(sys.stdin);s=d.get("system",{});print("OWNER",d.get("dashboard_owner"),"SOURCE",d.get("source"),"VERSION",d.get("version"),"CPU",s.get("cpu_percent"),"HISTORY",len(d.get("history",[])),"RUNNERS",d.get("summary",{}).get("runner_online"))'\''
            echo -- listeners --; sudo -n ss -lntp | grep -E ":(19861|9860)\\b"
            echo -- caddy-config-valid --; sudo -n caddy validate --config /etc/caddy/Caddyfile
          '

          echo '=== 4. VERIFY CADDY PUBLIC DASHBOARD :9860 ==='
          curl -fsS http://192.168.1.99:9860/health; echo
          D="$(curl -fsS http://192.168.1.99:9860/api/status)"
          python3 - "$D" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); s=d.get('system') or {}; su=d.get('summary') or {}
          print('RASPI_LIVE',d.get('dashboard_owner'),d.get('source'),d.get('version'),'CPU',s.get('cpu_percent'),'RAM',(s.get('memory') or {}).get('percent'),'DISK',(s.get('disk') or {}).get('percent'),'PROC',s.get('processes'),'RUNNERS',su.get('runner_online'),'/',su.get('runner_total'),'HISTORY',len(d.get('history') or []))
          assert d.get('source')=='redmi-build'
          assert d.get('version')=='redmi-telemetry-3.0'
          assert su.get('runner_online')==10 and su.get('runner_total')==10
          assert s.get('cpu_percent') is not None and s.get('processes') is not None
          PY
          H="$(curl -fsS http://192.168.1.99:9860/)"
          for q in 'Redmi Build Command Center' 'Live Performance Timeline' 'Runner / Build History' 'setInterval(tick,1000)'; do grep -q "$q" <<<"$H"; done

          echo '=== 5. VERIFY build.home PATH FROM RASPI ==='
          "${SSH[@]}" 'curl -fsS -H "Host: build.home" http://192.168.1.99/ | grep -q "Redmi Build Command Center"; curl -fsS -H "Host: build.home" http://192.168.1.99/health; echo'
          echo 'RASPI_DASHBOARD_REPAIR=PASS'
