name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Inspect Raspi dashboard ownership
        shell: bash
        run: |
          set -euo pipefail
          echo "HOST=$(hostname) RUNNER=${RUNNER_NAME:-unknown}"
          KEY="$HOME/.ssh/fujitsu-build-home"
          test -r "$KEY"
          SSH=(ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99)
          echo '=== REDMI ENDPOINTS ==='
          curl -fsS --max-time 4 http://127.0.0.1:9860/health || true; echo
          curl -fsS --max-time 4 http://127.0.0.1:9861/state | head -c 4000 || true; echo
          echo '=== RASPI ENDPOINTS ==='
          "${SSH[@]}" 'for u in http://127.0.0.1:9860/health http://127.0.0.1:9860/api/state http://127.0.0.1:9861/healthz http://127.0.0.1:9861/state; do echo ---$u---; curl -fsS --max-time 4 "$u" 2>/dev/null | head -c 3500 || true; echo; done'
          echo '=== RASPI OWNERS ==='
          "${SSH[@]}" 'sudo -n ss -lntp 2>/dev/null | grep -E ":(9860|9861)\\b" || true; echo ---processes---; ps -eo pid=,ppid=,etime=,args= | grep -Ei "9860|9861|dashboard|fujitsu-control|redmi-control" | grep -v grep | head -100 || true; echo ---units---; sudo -n systemctl --no-pager --all | grep -Ei "dashboard|fujitsu|redmi|986" | head -120 || true; echo ---refs---; sudo -n grep -RInI -E "9860|9861|FUJITSU|Fujitsu|fujitsu" /etc/systemd/system /etc/nginx /etc/caddy 2>/dev/null | head -260 || true'
