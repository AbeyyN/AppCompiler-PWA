name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Diagnose Raspi Caddy failure
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/fujitsu-build-home"; test -r "$KEY"
          SSH=(ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99)
          "${SSH[@]}" 'echo ===STATUS===; sudo -n systemctl --no-pager -l status caddy || true; echo ===JOURNAL===; sudo -n journalctl -u caddy -n 120 --no-pager || true; echo ===LISTENERS===; sudo -n ss -lntp | grep -E ":(80|9860|9861|19861)\\b" || true; echo ===CADDYFILE===; sudo -n nl -ba /etc/caddy/Caddyfile | sed -n "1,180p"; echo ===UNIT===; sudo -n systemctl cat caddy; echo ===CAPS===; getcap "$(command -v caddy)" || true; echo ===VALIDATE===; sudo -n caddy validate --config /etc/caddy/Caddyfile || true'
