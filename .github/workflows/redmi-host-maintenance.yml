name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Prepare final Redmi rename and schedule transactional runner cutover
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/home/abeyy
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          test "$(hostname)" = redmi-build
          echo "HOST=$(hostname) RUNNER=${RUNNER_NAME:-unknown}"

          echo '=== 1. PRECONDITION: RASPI OWNS DASHBOARD ==='
          curl -fsS http://127.0.0.1:9862/health; echo
          curl -fsS http://127.0.0.1:9861/state; echo
          KEY_OLD="$HOME/.ssh/fujitsu-build-home"
          KEY_NEW="$HOME/.ssh/redmi-build-home"
          test -r "$KEY_OLD"
          cp -p "$KEY_OLD" "$KEY_NEW"
          chmod 600 "$KEY_NEW"
          ssh -i "$KEY_NEW" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99 'curl -fsS http://192.168.1.99:9860/health; echo; curl -fsS http://192.168.1.99:9860/api/state | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get(\"source\")==\"redmi-build\";assert d.get(\"dashboard_owner\")==\"rapsi-nas\";print(\"RASPI_DASHBOARD\",sum(bool(x.get(\"online\")) for x in d.get(\"runners\",[])),len(d.get(\"runners\",[])))"'
          ! ss -lnt 2>/dev/null | grep -qE ':9860\b'

          echo '=== 2. MIGRATE REDMI CONFIG/STATE NAMES ==='
          migrate_dir(){ old="$1" new="$2"; if [ -d "$old" ]; then mkdir -p "$new"; cp -a "$old"/. "$new"/; rm -rf "$old"; fi; }
          migrate_dir "$HOME/.config/fujitsu-runner" "$HOME/.config/redmi-runner"
          migrate_dir "$HOME/.local/state/fujitsu-runner" "$HOME/.local/state/redmi-runner"
          migrate_dir "$HOME/.local/share/fujitsu-runner" "$HOME/.local/share/redmi-runner"
          migrate_dir "$HOME/.local/share/fujitsu-scheduler" "$HOME/.local/share/redmi-scheduler"
          migrate_dir "$HOME/backups/fujitsu-runner" "$HOME/backups/redmi-runner"

          echo '=== 3. RENAME LOCAL TOOLING ==='
          shopt -s nullglob
          for f in "$HOME/bin"/fujitsu-*; do
            b="$(basename "$f")"
            n="$HOME/bin/redmi-${b#fujitsu-}"
            if [ -e "$n" ] || [ -L "$n" ]; then rm -f "$f"; else mv "$f" "$n"; fi
          done
          shopt -u nullglob
          for root in "$HOME/bin" "$HOME/redmi-control" "$HOME/redmi-telemetry"; do
            [ -e "$root" ] || continue
            grep -RIl -E 'FUJITSU|Fujitsu|fujitsu' "$root" 2>/dev/null | while IFS= read -r f; do
              sed -i -e 's/FUJITSU/REDMI/g' -e 's/Fujitsu/Redmi/g' -e 's/fujitsu/redmi/g' "$f"
            done
          done
          if [ -f "$HOME/.ssh/config" ]; then sed -i -e 's/FUJITSU/REDMI/g' -e 's/Fujitsu/Redmi/g' -e 's/fujitsu/redmi/g' "$HOME/.ssh/config"; fi
          if sudo -n test -e /usr/local/sbin/fujitsu-temp-sudo-cleanup; then
            sudo -n mv /usr/local/sbin/fujitsu-temp-sudo-cleanup /usr/local/sbin/redmi-temp-sudo-cleanup
            sudo -n sed -i -e 's/FUJITSU/REDMI/g' -e 's/Fujitsu/Redmi/g' -e 's/fujitsu/redmi/g' /usr/local/sbin/redmi-temp-sudo-cleanup || true
          fi

          echo '=== 4. KEEP COMPAT HOOKS ONLY UNTIL CURRENT JOB ENDS ==='
          test -x "$HOME/bin/redmi-job-started.sh"
          test -x "$HOME/bin/redmi-job-completed.sh"
          ln -sfn "$HOME/bin/redmi-job-started.sh" "$HOME/bin/fujitsu-job-started.sh"
          ln -sfn "$HOME/bin/redmi-job-completed.sh" "$HOME/bin/fujitsu-job-completed.sh"
          for d in "$HOME/actions-runner"/*; do
            [ -f "$d/.env" ] || continue
            sed -i -e 's#/home/abeyy/bin/fujitsu-job-started.sh#/home/abeyy/bin/redmi-job-started.sh#g' -e 's#/home/abeyy/bin/fujitsu-job-completed.sh#/home/abeyy/bin/redmi-job-completed.sh#g' "$d/.env"
          done

          echo '=== 5. FIX TELEGRAM TO READ RASPI DASHBOARD ==='
          if [ -f "$HOME/bin/redmi-telegram-command-bot" ]; then
            sed -i 's#http://127.0.0.1:9860/api/state#http://192.168.1.99:9860/api/state#g' "$HOME/bin/redmi-telegram-command-bot"
          fi
          cat > "$HOME/bin/redmi-telegram-status" <<'EOF'
          #!/usr/bin/env bash
          set -u
          MODE="${1:-check}"
          API='http://192.168.1.99:9860/api/state'
          J="$(curl -fsS --max-time 8 "$API" 2>/dev/null || echo '{}')"
          python3 - "$MODE" "$J" <<'PY'
          import json,sys
          mode=sys.argv[1]
          try:d=json.loads(sys.argv[2])
          except Exception:d={}
          rr=d.get('runners') or []; runs=d.get('runs') or []; q=d.get('queue') or []; hist=d.get('history') or []
          online=sum(bool(x.get('online')) for x in rr)
          if mode=='runners':
              print(f'🖥 REDMI RUNNERS\n{online}/{len(rr)} online')
              for x in rr:
                  icon='🟡' if x.get('busy') else ('🟢' if x.get('online') else '🔴')
                  print(f"{icon} {x.get('directory','?')} — {x.get('name','?')}")
          elif mode=='queue':
              print(f'🚦 BUILD QUEUE\nRunning: {len(runs)} · Queued: {len(q)}')
              for x in (runs+q)[:20]: print(f"• {x.get('repo','?')} — {x.get('workflow') or x.get('workflowName') or '?'} — {x.get('status','?')}")
          elif mode=='failed':
              bad=[x for x in hist if x.get('conclusion')=='failure'][:20]
              print('❌ RECENT FAILURES')
              if not bad: print('Tiada failure dalam history semasa.')
              for x in bad: print(f"• {x.get('repo','?')} — {x.get('workflow') or x.get('workflowName') or '?'}")
          else:
              h=d.get('host') or {}
              print('📡 REDMI CI STATUS')
              print(f"Host: {h.get('hostname','redmi-build')}")
              print(f'Runners: {online}/{len(rr)} online')
              print(f'Running: {len(runs)} · Queued: {len(q)}')
              print(f"RAM: {h.get('mem_available_mb','?')} MB avail · Disk: {h.get('disk_pct','?')}% · Load: {h.get('load','?')}")
          PY
          EOF
          chmod 755 "$HOME/bin/redmi-telegram-status"

          echo '=== 6. INSTALL 10-RUNNER REDMI HEALTH LOOP ==='
          cat > "$HOME/bin/redmi-runner-health-loop.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          LOG="$HOME/logs/actions-runner/health.log"
          STATE_DIR="$HOME/.local/state/redmi-runner"
          mkdir -p "$(dirname "$LOG")" "$STATE_DIR"
          SPECS=(AppCompiler-PWA AppCompiler-PWA-01 OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT-light SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          notify(){ [ -x "$HOME/bin/redmi-telegram" ] && "$HOME/bin/redmi-telegram" "$1" || true; }
          alive(){ pgrep -f "$HOME/actions-runner/$1/bin/Runner.Listener run" >/dev/null 2>&1; }
          while true; do
            for n in "${SPECS[@]}"; do
              if ! alive "$n"; then
                sleep 8
                if ! alive "$n"; then
                  notify "⚠️ Redmi runner DOWN\n\nProject: $n\nAction: Auto-recovery starting"
                  if [ -x "$HOME/bin/redmi-runner-manager.sh" ]; then
                    pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
                    env -u RUNNER_TRACKING_ID nohup "$HOME/bin/redmi-runner-manager.sh" >>"$HOME/redmi-runner-manager.nohup.log" 2>&1 </dev/null &
                  fi
                  sleep 15
                  if alive "$n"; then notify "✅ Redmi runner RECOVERED\n\nProject: $n\nHost: redmi-build"; else notify "❌ Redmi runner recovery FAILED\n\nProject: $n\nManual check required."; fi
                fi
              fi
            done
            count="$(pgrep -fc 'Runner.Listener run' || true)"
            disk="$(df -P / | awk 'NR==2 {print $5}')"; mem="$(awk '/MemAvailable:/ {print int($2/1024)}' /proc/meminfo)"; load="$(awk '{print $1}' /proc/loadavg)"
            echo "$(date -Is) runners=$count disk=$disk available_mem=${mem}MB load=$load" >> "$LOG"
            sleep 60
          done
          EOF
          chmod 755 "$HOME/bin/redmi-runner-health-loop.sh"

          echo '=== 7. REWRITE BOOT/RUNTIME STARTER ==='
          cat > "$HOME/bin/start-all-github-runners.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          mkdir -p "$HOME/logs/actions-runner"
          if ! pgrep -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID nohup "$HOME/bin/redmi-runner-manager.sh" >>"$HOME/redmi-runner-manager.nohup.log" 2>&1 </dev/null &
          fi
          if [ -x "$HOME/bin/redmi-runner-health-loop.sh" ] && ! tmux has-session -t redmi-health 2>/dev/null; then env -u RUNNER_TRACKING_ID tmux new-session -d -s redmi-health "$HOME/bin/redmi-runner-health-loop.sh"; fi
          if [ -x "$HOME/bin/redmi-maintenance-loop.sh" ] && ! tmux has-session -t redmi-maintenance 2>/dev/null; then env -u RUNNER_TRACKING_ID tmux new-session -d -s redmi-maintenance "$HOME/bin/redmi-maintenance-loop.sh"; fi
          if [ -x "$HOME/bin/redmi-dr-loop.sh" ] && ! tmux has-session -t redmi-dr 2>/dev/null; then env -u RUNNER_TRACKING_ID tmux new-session -d -s redmi-dr "$HOME/bin/redmi-dr-loop.sh"; fi
          [ -x "$HOME/bin/redmi-control" ] && env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI "$HOME/bin/redmi-control" start || true
          if [ -x "$HOME/bin/redmi-telegram-command-bot" ] && ! tmux has-session -t redmi-telegram-bot 2>/dev/null; then
            env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI tmux new-session -d -s redmi-telegram-bot "unset RUNNER_TRACKING_ID GITHUB_ACTIONS CI; while true; do /home/abeyy/bin/redmi-telegram-command-bot; rc=\$?; [ \$rc -eq 2 ] && sleep 300 || sleep 5; done"
          fi
          EOF
          chmod 755 "$HOME/bin/start-all-github-runners.sh"
          (crontab -l 2>/dev/null | grep -v -E 'fujitsu|redmi-control-start|start-all-github-runners.sh' || true; echo '@reboot sleep 20; /home/abeyy/bin/start-all-github-runners.sh >>/home/abeyy/logs/actions-runner/boot.log 2>&1 # 986-redmi-runtime'; echo '@reboot sleep 25; /home/abeyy/bin/redmi-telemetry start # 986-redmi-telemetry') | crontab -

          echo '=== 8. UPDATE WORKFLOW LABEL REFERENCES IN ACTIVE REPOS ==='
          TMPROOT="$(mktemp -d /tmp/redmi-workflows.XXXXXX)"
          trap 'rm -rf "$TMPROOT"' EXIT
          for repo in OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager; do
            dir="$TMPROOT/$repo"
            if ! gh repo clone "AbeyyN/$repo" "$dir" -- --depth 1 >/dev/null 2>&1; then echo "CLONE_SKIP $repo"; continue; fi
            cd "$dir"
            [ -d .github/workflows ] || continue
            mapfile -t files < <(grep -RIl -E 'FUJITSU|Fujitsu|fujitsu' .github/workflows 2>/dev/null || true)
            [ "${#files[@]}" -gt 0 ] || continue
            for f in "${files[@]}"; do sed -i -e 's/FUJITSU/REDMI/g' -e 's/Fujitsu/Redmi/g' -e 's/fujitsu/redmi/g' "$f"; done
            git config user.name 'AbeyyTechXy Ops'
            git config user.email 'abeyytechxy.dev@gmail.com'
            git add .github/workflows
            if ! git diff --cached --quiet; then git commit -m 'ci: rename Fujitsu runner references to Redmi [skip ci]' >/dev/null; git push >/dev/null; echo "UPDATED_WORKFLOWS $repo"; fi
          done
          cd "$HOME"

          echo '=== 9. WRITE TRANSACTIONAL RUNNER RE-REGISTRATION ==='
          cat > "$HOME/bin/redmi-final-rename.sh" <<'FINAL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export HOME=/home/abeyy
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          LOG="$HOME/redmi-final-rename.log"
          exec >>"$LOG" 2>&1
          echo "===== REDMI FINAL RENAME $(date -Is) ====="
          echo "host=$(hostname)"
          test "$(hostname)" = redmi-build
          gh auth status >/dev/null 2>&1

          echo 'WAIT_FOR_ACTIVE_JOBS_TO_DRAIN'
          for i in $(seq 1 120); do
            n="$(pgrep -fc 'Runner.Worker' || true)"
            [ "$n" -eq 0 ] && break
            echo "workers=$n wait=$i"
            sleep 5
          done
          n="$(pgrep -fc 'Runner.Worker' || true)"
          if [ "$n" -ne 0 ]; then echo "ERROR workers still active=$n"; exit 20; fi

          pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
          sleep 2
          pkill -TERM -f '/home/abeyy/actions-runner/.*/bin/[R]unner.Listener run' 2>/dev/null || true
          sleep 4

          declare -a DIRS=(AppCompiler-PWA AppCompiler-PWA-01 OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT-light SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          declare -a REPOS=(AppCompiler-PWA AppCompiler-PWA OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          declare -a OLDN=(Fujitsu-PWA Fujitsu-PWA-01 Fujitsu-Ubuntu Fujitsu-Ubuntu-Light Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu-XStay)
          declare -a NEWN=(Redmi-PWA Redmi-PWA-01 Redmi-Ubuntu Redmi-Ubuntu-Light Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu-XStay)
          declare -a LABS=(redmi,pwa,central redmi,pwa,central redmi,openwrt,linux-build redmi,light,diagnostic redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build)

          backup="$HOME/.redmi-runner-reg-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$backup"

          for i in "${!DIRS[@]}"; do
            dir="${DIRS[$i]}"; repo="${REPOS[$i]}"; old="${OLDN[$i]}"; new="${NEWN[$i]}"; labels="${LABS[$i]}"; base="$HOME/actions-runner/$dir"
            echo "--- $dir : $old -> $new ---"
            test -x "$base/config.sh"
            mkdir -p "$backup/$dir"
            for f in .runner .credentials .credentials_rsaparams .env .path; do [ -e "$base/$f" ] && cp -a "$base/$f" "$backup/$dir/$f" || true; done
            oldid="$(gh api "repos/AbeyyN/$repo/actions/runners" --jq ".runners[]? | select(.name==\"$old\") | .id" | head -1 || true)"
            rm -f "$base/.runner" "$base/.credentials" "$base/.credentials_rsaparams" "$base/.env" "$base/.path"
            token="$(gh api -X POST "repos/AbeyyN/$repo/actions/runners/registration-token" --jq '.token')"
            if ! (cd "$base" && ./config.sh --unattended --replace --url "https://github.com/AbeyyN/$repo" --token "$token" --name "$new" --labels "$labels" --work "../../runner-work/$dir"); then
              echo "CONFIG_FAIL $dir restoring old local config"
              rm -f "$base/.runner" "$base/.credentials" "$base/.credentials_rsaparams" "$base/.env" "$base/.path"
              cp -a "$backup/$dir"/. "$base"/
              env -u RUNNER_TRACKING_ID nohup bash -lc "cd '$base' && exec ./run.sh" >>"$HOME/logs/actions-runner/$dir.log" 2>&1 </dev/null &
              exit 30
            fi
            {
              grep -v '^ACTIONS_RUNNER_HOOK_JOB_STARTED=' "$base/.env" 2>/dev/null || true
            } > "$base/.env.tmp"
            mv "$base/.env.tmp" "$base/.env"
            {
              grep -v '^ACTIONS_RUNNER_HOOK_JOB_COMPLETED=' "$base/.env" 2>/dev/null || true
              echo 'ACTIONS_RUNNER_HOOK_JOB_STARTED=/home/abeyy/bin/redmi-job-started.sh'
              echo 'ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/home/abeyy/bin/redmi-job-completed.sh'
            } > "$base/.env.tmp"
            mv "$base/.env.tmp" "$base/.env"
            env -u RUNNER_TRACKING_ID nohup bash -lc "cd '$base' && exec ./run.sh" >>"$HOME/logs/actions-runner/$dir.log" 2>&1 </dev/null &
            ok=0
            for j in $(seq 1 30); do
              status="$(gh api "repos/AbeyyN/$repo/actions/runners" --jq ".runners[]? | select(.name==\"$new\") | .status" | head -1 || true)"
              [ "$status" = online ] && { ok=1; break; }
              sleep 2
            done
            [ "$ok" -eq 1 ] || { echo "ONLINE_FAIL $dir $new"; exit 31; }
            if [ -n "$oldid" ]; then gh api -X DELETE "repos/AbeyyN/$repo/actions/runners/$oldid" >/dev/null 2>&1 || true; fi
            echo "RENAMED_OK $dir $new"
          done

          echo 'START_MANAGER_AND_RUNTIME'
          pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
          env -u RUNNER_TRACKING_ID nohup "$HOME/bin/redmi-runner-manager.sh" >>"$HOME/redmi-runner-manager.nohup.log" 2>&1 </dev/null &
          sleep 8
          "$HOME/bin/start-all-github-runners.sh" || true
          sleep 5

          rm -f "$HOME/bin/fujitsu-job-started.sh" "$HOME/bin/fujitsu-job-completed.sh" "$HOME/.ssh/fujitsu-build-home"
          rm -f "$HOME/bin"/start-all-github-runners.sh.bak.* "$HOME/bin"/start-all-github-runners.sh.pre-* 2>/dev/null || true
          find "$HOME/bin" -maxdepth 1 -type f -name 'fujitsu-*' -delete 2>/dev/null || true
          find "$HOME/bin" -maxdepth 1 -type l -name 'fujitsu-*' -delete 2>/dev/null || true

          echo 'VERIFY_GITHUB_FLEET'
          total=0; online=0; bad=0
          for repo in AppCompiler-PWA OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager; do
            j="$(gh api "repos/AbeyyN/$repo/actions/runners")"
            echo "$j" | jq -r '.runners[]? | [.name,(.labels|map(.name)|join(",")),.status,.busy] | @tsv'
            b="$(echo "$j" | jq '[.runners[]? | select((.name|test("Fujitsu|FUJITSU|fujitsu")) or ([.labels[]?.name]|index("fujitsu")))] | length')"
            [ "$b" -eq 0 ] || bad=$((bad+b))
            c="$(echo "$j" | jq '[.runners[]? | select([.labels[]?.name]|index("redmi"))] | length')"; o="$(echo "$j" | jq '[.runners[]? | select((([.labels[]?.name]|index("redmi"))!=null) and .status=="online")] | length')"
            total=$((total+c)); online=$((online+o))
          done
          echo "REDMI_GITHUB_RUNNERS=$online/$total LEGACY_BAD=$bad"
          [ "$total" -eq 10 ] && [ "$online" -eq 10 ] && [ "$bad" -eq 0 ]
          ! grep -RInI -E 'FUJITSU|Fujitsu|fujitsu' "$HOME/actions-runner"/*/.env "$HOME/bin" 2>/dev/null | grep -v 'redmi-final-rename.sh' | head -1
          ! find "$HOME/bin" -maxdepth 1 -iname 'fujitsu*' | grep -q .
          ! test -e "$HOME/.config/fujitsu-runner"
          ! test -e "$HOME/.local/state/fujitsu-runner"
          ! test -e "$HOME/.local/share/fujitsu-runner"
          ! test -e "$HOME/.local/share/fujitsu-scheduler"
          ! ss -lnt 2>/dev/null | grep -qE ':9860\b'
          curl -fsS http://127.0.0.1:9862/health; echo
          curl -fsS http://127.0.0.1:9861/state; echo
          curl -fsS http://192.168.1.99:9860/health; echo
          curl -fsS http://192.168.1.99:9860/api/state | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("source")=="redmi-build";assert d.get("dashboard_owner")=="rapsi-nas";print("DASHBOARD_RASPI_OK",sum(bool(x.get("online")) for x in d.get("runners",[])),len(d.get("runners",[])))'
          [ -x "$HOME/bin/redmi-telegram" ] && "$HOME/bin/redmi-telegram" "✅ Redmi build migration COMPLETE\n\nHost: redmi-build\nGitHub runners: 10/10 online\nDashboard owner: rapsi-nas\nLegacy Fujitsu build identity: removed\n\nFujitsu lama selamat untuk dipasang semula sebagai fujitsu-server." || true
          echo "FINAL_RENAME_PASS $(date -Is)"
          FINAL
          chmod 755 "$HOME/bin/redmi-final-rename.sh"

          echo '=== 10. SCHEDULE OUTSIDE ACTIONS AFTER THIS JOB COMPLETES ==='
          sudo -n systemctl stop redmi-final-rename.service 2>/dev/null || true
          sudo -n systemd-run --unit=redmi-final-rename --on-active=45s --property=User=abeyy --property=WorkingDirectory=/home/abeyy /home/abeyy/bin/redmi-final-rename.sh
          sudo -n systemctl list-timers --all --no-pager | grep redmi-final-rename || true
          echo FINAL_RENAME_SCHEDULED=YES
