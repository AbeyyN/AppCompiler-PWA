name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Recover partial rename and schedule final runner cutover
        shell: bash
        run: |
          set +e
          export HOME=/home/abeyy
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "HOST=$(hostname) RUNNER=${RUNNER_NAME:-unknown}"
          test "$(hostname)" = redmi-build || exit 10

          echo '=== 1. REPAIR HOOK PATHS IMMEDIATELY ==='
          ls -l "$HOME/bin"/redmi-job-started.sh "$HOME/bin"/redmi-job-completed.sh 2>/dev/null || true
          test -x "$HOME/bin/redmi-job-started.sh" || exit 11
          test -x "$HOME/bin/redmi-job-completed.sh" || exit 12
          ln -sfn "$HOME/bin/redmi-job-started.sh" "$HOME/bin/fujitsu-job-started.sh"
          ln -sfn "$HOME/bin/redmi-job-completed.sh" "$HOME/bin/fujitsu-job-completed.sh"
          for d in "$HOME/actions-runner"/*; do
            [ -f "$d/.env" ] || continue
            sed -i \
              -e 's#/home/abeyy/bin/fujitsu-job-started.sh#/home/abeyy/bin/redmi-job-started.sh#g' \
              -e 's#/home/abeyy/bin/fujitsu-job-completed.sh#/home/abeyy/bin/redmi-job-completed.sh#g' \
              "$d/.env"
          done

          echo '=== 2. CONFIRM PARTIAL RENAME STATE ==='
          echo '-- redmi tools --'
          find "$HOME/bin" -maxdepth 1 -name 'redmi-*' -printf '%f\n' | sort | head -100
          echo '-- legacy tool aliases --'
          find "$HOME/bin" -maxdepth 1 -name 'fujitsu-*' -printf '%f -> %l\n' | sort || true
          echo '-- state dirs --'
          for p in "$HOME/.config/redmi-runner" "$HOME/.local/state/redmi-runner" "$HOME/.local/share/redmi-runner" "$HOME/.local/share/redmi-scheduler"; do [ -e "$p" ] && echo "OK $p" || echo "MISSING $p"; done
          test -r "$HOME/.ssh/redmi-build-home" || { test -r "$HOME/.ssh/fujitsu-build-home" && cp -p "$HOME/.ssh/fujitsu-build-home" "$HOME/.ssh/redmi-build-home"; }
          chmod 600 "$HOME/.ssh/redmi-build-home" 2>/dev/null || true

          echo '=== 3. NORMALIZE ACTIVE REDMI TOOL CONTENT ==='
          while IFS= read -r -d '' f; do
            grep -Iq . "$f" 2>/dev/null || continue
            sed -i -e 's/FUJITSU/REDMI/g' -e 's/Fujitsu/Redmi/g' -e 's/fujitsu/redmi/g' "$f" 2>/dev/null || true
          done < <(find "$HOME/bin" -maxdepth 1 -type f -name 'redmi-*' -print0)
          if [ -f "$HOME/bin/redmi-telegram-command-bot" ]; then
            sed -i 's#http://127.0.0.1:9860/api/state#http://192.168.1.99:9860/api/state#g' "$HOME/bin/redmi-telegram-command-bot"
          fi

          echo '=== 4. INSTALL SIMPLE DASHBOARD-BACKED TELEGRAM STATUS ==='
          cat > "$HOME/bin/redmi-telegram-status" <<'EOF'
          #!/usr/bin/env bash
          set -u
          MODE="${1:-check}"
          J="$(curl -fsS --max-time 8 http://192.168.1.99:9860/api/state 2>/dev/null || echo '{}')"
          python3 - "$MODE" "$J" <<'PY'
          import json,sys
          mode=sys.argv[1]
          try:d=json.loads(sys.argv[2])
          except Exception:d={}
          rr=d.get('runners') or []; runs=d.get('runs') or []; q=d.get('queue') or []; hist=d.get('history') or []; h=d.get('host') or {}
          online=sum(bool(x.get('online')) for x in rr)
          if mode=='runners':
              print(f'🖥 REDMI RUNNERS\n{online}/{len(rr)} online')
              for x in rr:
                  icon='🟡' if x.get('busy') else ('🟢' if x.get('online') else '🔴')
                  print(f"{icon} {x.get('directory','?')} — {x.get('name','?')}")
          elif mode=='queue':
              print(f'🚦 BUILD QUEUE\nRunning: {len(runs)} · Queued: {len(q)}')
              for x in (runs+q)[:20]: print(f"• {x.get('repo','?')} — {x.get('workflow') or x.get('workflowName') or '?'} — {x.get('status','?')}")
          elif mode=='failed':
              bad=[x for x in hist if x.get('conclusion')=='failure'][:20]
              print('❌ RECENT FAILURES')
              print('Tiada failure dalam history semasa.' if not bad else '')
              for x in bad: print(f"• {x.get('repo','?')} — {x.get('workflow') or x.get('workflowName') or '?'}")
          else:
              print('📡 REDMI CI STATUS')
              print(f"Host: {h.get('hostname','redmi-build')}")
              print(f'Runners: {online}/{len(rr)} online')
              print(f'Running: {len(runs)} · Queued: {len(q)}')
              print(f"RAM: {h.get('mem_available_mb','?')} MB avail · Disk: {h.get('disk_pct','?')}% · Load: {h.get('load','?')}")
          PY
          EOF
          chmod 755 "$HOME/bin/redmi-telegram-status"

          echo '=== 5. INSTALL REDMI 10-RUNNER HEALTH LOOP + STARTER ==='
          cat > "$HOME/bin/redmi-runner-health-loop.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          LOG="$HOME/logs/actions-runner/health.log"
          mkdir -p "$(dirname "$LOG")" "$HOME/.local/state/redmi-runner"
          SPECS=(AppCompiler-PWA AppCompiler-PWA-01 OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT-light SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          notify(){ [ -x "$HOME/bin/redmi-telegram" ] && "$HOME/bin/redmi-telegram" "$1" || true; }
          alive(){ pgrep -f "$HOME/actions-runner/$1/bin/Runner.Listener run" >/dev/null 2>&1; }
          while true; do
            for n in "${SPECS[@]}"; do
              if ! alive "$n"; then
                sleep 8
                if ! alive "$n"; then
                  notify "⚠️ Redmi runner DOWN\n\nProject: $n\nAction: Auto-recovery starting"
                  if [ -x "$HOME/bin/redmi-runner-manager.sh" ]; then
                    pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
                    env -u RUNNER_TRACKING_ID nohup "$HOME/bin/redmi-runner-manager.sh" >>"$HOME/redmi-runner-manager.nohup.log" 2>&1 </dev/null &
                  fi
                  sleep 15
                  if alive "$n"; then notify "✅ Redmi runner RECOVERED\n\nProject: $n\nHost: redmi-build"; else notify "❌ Redmi runner recovery FAILED\n\nProject: $n\nManual check required."; fi
                fi
              fi
            done
            echo "$(date -Is) runners=$(pgrep -fc 'Runner.Listener run' || true) disk=$(df -P / | awk 'NR==2 {print $5}') available_mem=$(awk '/MemAvailable:/ {print int($2/1024)}' /proc/meminfo)MB load=$(awk '{print $1}' /proc/loadavg)" >> "$LOG"
            sleep 60
          done
          EOF
          chmod 755 "$HOME/bin/redmi-runner-health-loop.sh"

          cat > "$HOME/bin/start-all-github-runners.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          mkdir -p "$HOME/logs/actions-runner"
          if ! pgrep -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' >/dev/null 2>&1; then env -u RUNNER_TRACKING_ID nohup "$HOME/bin/redmi-runner-manager.sh" >>"$HOME/redmi-runner-manager.nohup.log" 2>&1 </dev/null & fi
          if [ -x "$HOME/bin/redmi-runner-health-loop.sh" ] && ! tmux has-session -t redmi-health 2>/dev/null; then env -u RUNNER_TRACKING_ID tmux new-session -d -s redmi-health "$HOME/bin/redmi-runner-health-loop.sh"; fi
          if [ -x "$HOME/bin/redmi-maintenance-loop.sh" ] && ! tmux has-session -t redmi-maintenance 2>/dev/null; then env -u RUNNER_TRACKING_ID tmux new-session -d -s redmi-maintenance "$HOME/bin/redmi-maintenance-loop.sh"; fi
          if [ -x "$HOME/bin/redmi-dr-loop.sh" ] && ! tmux has-session -t redmi-dr 2>/dev/null; then env -u RUNNER_TRACKING_ID tmux new-session -d -s redmi-dr "$HOME/bin/redmi-dr-loop.sh"; fi
          [ -x "$HOME/bin/redmi-control" ] && env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI "$HOME/bin/redmi-control" start || true
          if [ -x "$HOME/bin/redmi-telegram-command-bot" ] && ! tmux has-session -t redmi-telegram-bot 2>/dev/null; then env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI tmux new-session -d -s redmi-telegram-bot "unset RUNNER_TRACKING_ID GITHUB_ACTIONS CI; while true; do /home/abeyy/bin/redmi-telegram-command-bot; rc=\$?; [ \$rc -eq 2 ] && sleep 300 || sleep 5; done"; fi
          EOF
          chmod 755 "$HOME/bin/start-all-github-runners.sh"
          (crontab -l 2>/dev/null | grep -v -Ei 'fujitsu|986-redmi-runtime|986-redmi-telemetry' || true; echo '@reboot sleep 20; /home/abeyy/bin/start-all-github-runners.sh >>/home/abeyy/logs/actions-runner/boot.log 2>&1 # 986-redmi-runtime'; echo '@reboot sleep 25; /home/abeyy/bin/redmi-telemetry start # 986-redmi-telemetry') | crontab -

          echo '=== 6. UPDATE ACTIVE REPO WORKFLOW REFERENCES ==='
          TMPROOT="$(mktemp -d /tmp/redmi-workflows.XXXXXX)"
          for repo in OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager; do
            dir="$TMPROOT/$repo"
            gh repo clone "AbeyyN/$repo" "$dir" -- --depth 1 >/dev/null 2>&1 || { echo "CLONE_SKIP $repo"; continue; }
            cd "$dir" || continue
            [ -d .github/workflows ] || continue
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              sed -i -e 's/FUJITSU/REDMI/g' -e 's/Fujitsu/Redmi/g' -e 's/fujitsu/redmi/g' "$f"
            done < <(grep -RIl -E 'FUJITSU|Fujitsu|fujitsu' .github/workflows 2>/dev/null || true)
            git config user.name 'AbeyyTechXy Ops'
            git config user.email 'abeyytechxy.dev@gmail.com'
            git add .github/workflows >/dev/null 2>&1
            if ! git diff --cached --quiet; then
              git commit -m 'ci: rename Fujitsu runner references to Redmi [skip ci]' >/dev/null 2>&1 && git push >/dev/null 2>&1 && echo "UPDATED_WORKFLOWS $repo" || echo "WORKFLOW_PUSH_FAILED $repo"
            fi
          done
          cd "$HOME"
          rm -rf "$TMPROOT"

          echo '=== 7. WRITE DETACHED TRANSACTIONAL RUNNER RENAME ==='
          cat > "$HOME/bin/redmi-final-rename.sh" <<'FINAL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export HOME=/home/abeyy
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          LOG="$HOME/redmi-final-rename.log"
          exec >>"$LOG" 2>&1
          echo "===== REDMI FINAL RENAME $(date -Is) ====="
          test "$(hostname)" = redmi-build
          gh auth status >/dev/null 2>&1

          echo WAIT_FOR_WORKERS
          for i in $(seq 1 120); do
            n="$(pgrep -fc 'Runner.Worker' || true)"
            [ "$n" -eq 0 ] && break
            echo "workers=$n wait=$i"
            sleep 5
          done
          n="$(pgrep -fc 'Runner.Worker' || true)"
          [ "$n" -eq 0 ] || { echo "ERROR workers=$n"; exit 20; }

          pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
          pkill -TERM -f '/home/abeyy/actions-runner/.*/bin/[R]unner.Listener run' 2>/dev/null || true
          sleep 5

          DIRS=(AppCompiler-PWA AppCompiler-PWA-01 OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT-light SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          REPOS=(AppCompiler-PWA AppCompiler-PWA OpenWRT---AbeyyWRT OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager)
          OLDN=(Fujitsu-PWA Fujitsu-PWA-01 Fujitsu-Ubuntu Fujitsu-Ubuntu-Light Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu Fujitsu-Ubuntu-XStay)
          NEWN=(Redmi-PWA Redmi-PWA-01 Redmi-Ubuntu Redmi-Ubuntu-Light Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu Redmi-Ubuntu-XStay)
          LABS=(redmi,pwa,central redmi,pwa,central redmi,openwrt,linux-build redmi,light,diagnostic redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build redmi,android,pwa,flutter,api36,linux-build)
          BACK="$HOME/.redmi-runner-reg-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACK"

          for i in "${!DIRS[@]}"; do
            dir="${DIRS[$i]}"; repo="${REPOS[$i]}"; old="${OLDN[$i]}"; new="${NEWN[$i]}"; labels="${LABS[$i]}"; base="$HOME/actions-runner/$dir"
            echo "--- $dir $old -> $new ---"
            test -x "$base/config.sh"
            mkdir -p "$BACK/$dir"
            for f in .runner .credentials .credentials_rsaparams .env .path; do [ -e "$base/$f" ] && cp -a "$base/$f" "$BACK/$dir/$f" || true; done
            oldid="$(gh api "repos/AbeyyN/$repo/actions/runners" --jq ".runners[]? | select(.name==\"$old\") | .id" | head -1 || true)"
            newid="$(gh api "repos/AbeyyN/$repo/actions/runners" --jq ".runners[]? | select(.name==\"$new\") | .id" | head -1 || true)"
            if [ -n "$newid" ]; then gh api -X DELETE "repos/AbeyyN/$repo/actions/runners/$newid" >/dev/null 2>&1 || true; fi
            rm -f "$base/.runner" "$base/.credentials" "$base/.credentials_rsaparams" "$base/.env" "$base/.path"
            token="$(gh api -X POST "repos/AbeyyN/$repo/actions/runners/registration-token" --jq '.token')"
            if ! (cd "$base" && ./config.sh --unattended --replace --url "https://github.com/AbeyyN/$repo" --token "$token" --name "$new" --labels "$labels" --work "../../runner-work/$dir"); then
              echo "CONFIG_FAIL $dir"
              rm -f "$base/.runner" "$base/.credentials" "$base/.credentials_rsaparams" "$base/.env" "$base/.path"
              cp -a "$BACK/$dir"/. "$base"/
              env -u RUNNER_TRACKING_ID nohup bash -lc "cd '$base' && exec ./run.sh" >>"$HOME/logs/actions-runner/$dir.log" 2>&1 </dev/null &
              exit 30
            fi
            awk '!/^ACTIONS_RUNNER_HOOK_JOB_STARTED=|^ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/' "$base/.env" 2>/dev/null > "$base/.env.new" || true
            printf '%s\n' 'ACTIONS_RUNNER_HOOK_JOB_STARTED=/home/abeyy/bin/redmi-job-started.sh' 'ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/home/abeyy/bin/redmi-job-completed.sh' >> "$base/.env.new"
            mv "$base/.env.new" "$base/.env"
            env -u RUNNER_TRACKING_ID nohup bash -lc "cd '$base' && exec ./run.sh" >>"$HOME/logs/actions-runner/$dir.log" 2>&1 </dev/null &
            ok=0
            for j in $(seq 1 30); do
              st="$(gh api "repos/AbeyyN/$repo/actions/runners" --jq ".runners[]? | select(.name==\"$new\") | .status" | head -1 || true)"
              [ "$st" = online ] && { ok=1; break; }
              sleep 2
            done
            [ "$ok" -eq 1 ] || { echo "ONLINE_FAIL $dir $new"; exit 31; }
            [ -z "$oldid" ] || gh api -X DELETE "repos/AbeyyN/$repo/actions/runners/$oldid" >/dev/null 2>&1 || true
            echo "RENAMED_OK $dir $new"
          done

          pkill -TERM -f '/home/abeyy/bin/[r]edmi-runner-manager.sh' 2>/dev/null || true
          env -u RUNNER_TRACKING_ID nohup "$HOME/bin/redmi-runner-manager.sh" >>"$HOME/redmi-runner-manager.nohup.log" 2>&1 </dev/null &
          sleep 5
          "$HOME/bin/start-all-github-runners.sh" || true
          sleep 5

          rm -f "$HOME/bin/fujitsu-job-started.sh" "$HOME/bin/fujitsu-job-completed.sh" "$HOME/.ssh/fujitsu-build-home"
          rm -f "$HOME/bin"/start-all-github-runners.sh.bak.* "$HOME/bin"/start-all-github-runners.sh.pre-* 2>/dev/null || true
          find "$HOME/bin" -maxdepth 1 -type f -name 'fujitsu-*' -delete 2>/dev/null || true
          find "$HOME/bin" -maxdepth 1 -type l -name 'fujitsu-*' -delete 2>/dev/null || true

          total=0; online=0; bad=0
          for repo in AppCompiler-PWA OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager; do
            j="$(gh api "repos/AbeyyN/$repo/actions/runners")"
            echo "$j" | jq -r '.runners[]? | [.name,(.labels|map(.name)|join(",")),.status,.busy] | @tsv'
            b="$(echo "$j" | jq '[.runners[]? | select((.name|test("Fujitsu|FUJITSU|fujitsu")) or (([.labels[]?.name]|index("fujitsu"))!=null))] | length')"
            c="$(echo "$j" | jq '[.runners[]? | select(([.labels[]?.name]|index("redmi"))!=null)] | length')"
            o="$(echo "$j" | jq '[.runners[]? | select((([.labels[]?.name]|index("redmi"))!=null) and .status=="online")] | length')"
            bad=$((bad+b)); total=$((total+c)); online=$((online+o))
          done
          echo "REDMI_GITHUB_RUNNERS=$online/$total LEGACY_BAD=$bad"
          [ "$total" -eq 10 ] && [ "$online" -eq 10 ] && [ "$bad" -eq 0 ]
          ! find "$HOME/bin" -maxdepth 1 -iname 'fujitsu*' | grep -q .
          ! test -e "$HOME/.config/fujitsu-runner"
          ! test -e "$HOME/.local/state/fujitsu-runner"
          ! test -e "$HOME/.local/share/fujitsu-runner"
          ! test -e "$HOME/.local/share/fujitsu-scheduler"
          ! ss -lnt 2>/dev/null | grep -qE ':9860\b'
          curl -fsS http://127.0.0.1:9862/health; echo
          curl -fsS http://127.0.0.1:9861/state; echo
          curl -fsS http://192.168.1.99:9860/health; echo
          curl -fsS http://192.168.1.99:9860/api/state | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("source")=="redmi-build";assert d.get("dashboard_owner")=="rapsi-nas";print("DASHBOARD_RASPI_OK",sum(bool(x.get("online")) for x in d.get("runners",[])),len(d.get("runners",[])))'
          [ -x "$HOME/bin/redmi-telegram" ] && "$HOME/bin/redmi-telegram" "✅ Redmi build migration COMPLETE\n\nHost: redmi-build\nGitHub runners: 10/10 online\nDashboard owner: rapsi-nas\nLegacy Fujitsu build identity: removed\n\nFujitsu lama selamat untuk dipasang semula sebagai fujitsu-server." || true
          echo "FINAL_RENAME_PASS $(date -Is)"
          FINAL
          chmod 755 "$HOME/bin/redmi-final-rename.sh"

          echo '=== 8. START CURRENT REDMI HELPERS ==='
          tmux kill-session -t fujitsu-health 2>/dev/null || true
          tmux kill-session -t fujitsu-maintenance 2>/dev/null || true
          tmux kill-session -t fujitsu-dr 2>/dev/null || true
          tmux kill-session -t fujitsu-telegram-bot 2>/dev/null || true
          pkill -TERM -f '^bash /home/abeyy/bin/fujitsu-telegram-command-bot$' 2>/dev/null || true
          "$HOME/bin/start-all-github-runners.sh" || true

          echo '=== 9. SCHEDULE FINAL RUNNER RENAME AFTER THIS JOB ==='
          sudo -n systemctl stop redmi-final-rename.service redmi-final-rename.timer 2>/dev/null || true
          sudo -n systemd-run --unit=redmi-final-rename --on-active=35s --property=User=abeyy --property=WorkingDirectory=/home/abeyy /home/abeyy/bin/redmi-final-rename.sh
          sudo -n systemctl list-timers --all --no-pager | grep redmi-final-rename || true
          echo FINAL_RENAME_SCHEDULED=YES
          exit 0
