name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Launch detached final Redmi runner rename
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/home/abeyy
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          test "$(hostname)" = redmi-build
          test -x "$HOME/bin/redmi-final-rename.sh"
          test -x "$HOME/bin/redmi-job-started.sh"
          test -x "$HOME/bin/redmi-job-completed.sh"
          ln -sfn "$HOME/bin/redmi-job-started.sh" "$HOME/bin/fujitsu-job-started.sh"
          ln -sfn "$HOME/bin/redmi-job-completed.sh" "$HOME/bin/fujitsu-job-completed.sh"
          curl -fsS http://192.168.1.99:9860/health | grep -q 'rapsi-nas'
          ! ss -lnt 2>/dev/null | grep -qE ':9860\b'
          rm -f "$HOME/redmi-final-rename-launch.log"
          setsid -f env -u RUNNER_TRACKING_ID -u GITHUB_ACTIONS -u CI \
            bash -lc 'sleep 15; exec /home/abeyy/bin/redmi-final-rename.sh' \
            >>"$HOME/redmi-final-rename-launch.log" 2>&1 </dev/null
          echo 'FINAL_RENAME_DETACHED=YES'
          echo 'It will start after this GitHub job has exited.'
