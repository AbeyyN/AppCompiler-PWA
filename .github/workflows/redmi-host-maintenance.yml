name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Diagnose Raspi dashboard service startup
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/fujitsu-build-home"
          test -r "$KEY"
          SSH=(ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99)
          echo '=== UNIT ==='
          "${SSH[@]}" 'sudo -n systemctl cat redmi-dashboard.service || true'
          echo '=== JOURNAL ==='
          "${SSH[@]}" 'sudo -n journalctl -u redmi-dashboard.service -n 100 --no-pager || true'
          echo '=== DASHBOARD ENV/PATH REFERENCES ==='
          "${SSH[@]}" 'grep -nE "REDMI_DASHBOARD|PORT|BIND|actions-runner|runner-work|/home/abeyy" "$HOME/redmi-dashboard/dashboard.py" | head -260 || true'
          echo '=== TOP OF SOURCE ==='
          "${SSH[@]}" 'sed -n "1,180p" "$HOME/redmi-dashboard/dashboard.py"'
