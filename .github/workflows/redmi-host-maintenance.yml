name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Audit runner registration and rename path
        shell: bash
        run: |
          set -euo pipefail
          echo "HOST=$(hostname) RUNNER=${RUNNER_NAME:-unknown}"
          echo '=== GH AUTH SAFE ==='
          gh auth status 2>&1 | sed -E 's/(Token:).*/\1 [REDACTED]/I' | head -60 || true
          echo '=== REPO RUNNERS FROM GITHUB ==='
          for repo in AppCompiler-PWA OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager; do
            echo "--- $repo ---"
            gh api "repos/AbeyyN/$repo/actions/runners" --jq '.runners[]? | [.id,.name,(.labels|map(.name)|join(",")),.status,.busy] | @tsv' 2>/dev/null || echo API_DENIED
          done
          echo '=== LOCAL REREGISTER SCRIPT ==='
          sed -n '1,240p' "$HOME/bin/fujitsu-reregister-all-runners" 2>/dev/null || true
          echo '=== RUNNER HOOK REFERENCES ==='
          grep -RInI -i 'fujitsu' "$HOME/actions-runner"/*/.env "$HOME/actions-runner"/*/.path 2>/dev/null | head -180 || true
          echo '=== START ALL SCRIPT ==='
          sed -n '1,220p' "$HOME/bin/start-all-github-runners.sh" 2>/dev/null || true
          echo '=== CURRENT CADDYFILE ==='
          KEY="$HOME/.ssh/fujitsu-build-home"
          test -r "$KEY"
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99 'sudo -n sed -n "1,120p" /etc/caddy/Caddyfile'
