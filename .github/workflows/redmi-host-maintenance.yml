name: Redmi Host Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redmi-host-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 12
    steps:
      - name: Audit remaining Fujitsu runtime references
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "HOST=$(hostname) RUNNER=${RUNNER_NAME:-unknown}"
          test "$(hostname)" = redmi-build
          echo '=== GITHUB RUNNERS ==='
          for repo in AppCompiler-PWA OpenWRT---AbeyyWRT SK-Gong-Kapas X7-Core-Academy XHomeNetwork XMA7 XSAHub XStay-Manager; do
            echo "--- $repo ---"
            gh api "repos/AbeyyN/$repo/actions/runners" --jq '.runners[]? | [.id,.name,(.labels|map(.name)|join(",")),.status,.busy] | @tsv' || true
          done
          echo '=== TMUX ==='
          tmux ls 2>/dev/null || true
          echo '=== CRONTAB ==='
          crontab -l 2>/dev/null || true
          echo '=== BIN NAMES ==='
          find "$HOME/bin" -maxdepth 1 -type f -o -type l | sed 's#^.*/##' | sort | grep -Ei 'fujitsu|redmi|runner|telegram|health|maint|dr|control' || true
          echo '=== ACTIVE FUJITSU CONTENT REFS ==='
          grep -RInI -E 'FUJITSU|Fujitsu|fujitsu' "$HOME/bin" "$HOME/redmi-control" "$HOME/redmi-telemetry" "$HOME/actions-runner"/*/.env "$HOME/actions-runner"/*/.path 2>/dev/null | head -700 || true
          echo '=== START SCRIPT ==='
          sed -n '1,320p' "$HOME/bin/start-all-github-runners.sh" 2>/dev/null || true
          echo '=== JOB HOOKS ==='
          for f in "$HOME/bin"/*job-started* "$HOME/bin"/*job-completed*; do [ -f "$f" ] || continue; echo "--- $f ---"; sed -n '1,260p' "$f"; done
          echo '=== HEALTH/MONITOR/TELEGRAM FILES ==='
          for f in "$HOME/bin"/*health* "$HOME/bin"/*maintenance* "$HOME/bin"/*dr* "$HOME/bin"/*telegram*; do [ -f "$f" ] || continue; echo "--- $f ---"; sed -n '1,260p' "$f"; done
          echo '=== SYSTEMD FUJITSU REFS ==='
          sudo -n grep -RInI -E 'FUJITSU|Fujitsu|fujitsu' /etc/systemd/system 2>/dev/null | head -300 || true
          echo '=== DASHBOARD PROOF ==='
          test ! -e "$HOME/fujitsu-dashboard"
          ! ss -lnt 2>/dev/null | grep -qE ':9860\b'
          curl -fsS http://127.0.0.1:9862/health; echo
          curl -fsS http://127.0.0.1:9861/state; echo
          KEY="$HOME/.ssh/fujitsu-build-home"
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new abeyy@192.168.1.99 'curl -fsS http://192.168.1.99:9860/health; echo; curl -fsS http://192.168.1.99:9860/api/state | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get(\"source\"),d.get(\"dashboard_owner\"),sum(bool(x.get(\"online\")) for x in d.get(\"runners\",[])),len(d.get(\"runners\",[])))"'
