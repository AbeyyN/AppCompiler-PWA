name: Expand Global NAS All APK Collection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-global-nas-all-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expand:
    runs-on: [self-hosted, linux, x64, fujitsu, pwa, central]
    timeout-minutes: 15
    steps:
      - name: Persist all fresh APK policy in universal collector
        shell: bash
        run: |
          set -euo pipefail
          GH=(env -u GH_TOKEN -u GITHUB_TOKEN gh)
          meta="$RUNNER_TEMP/meta.json"; src="$RUNNER_TEMP/collector-v2.sh"
          ok=0
          for n in 1 2 3 4 5; do
            if timeout 45s "${GH[@]}" api repos/AbeyyN/X7-Core-Academy/contents/infra/nas-artifacts/collector-v2.sh?ref=main > "$meta"; then ok=1; break; fi
            sleep $((n*2))
          done
          test "$ok" -eq 1
          jq -r '.content' "$meta" | tr -d '\n' | base64 -d > "$src"
          sha="$(jq -r '.sha' "$meta")"

          python3 - "$src" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='''  while IFS= read -r -d '' f; do\n    case "$(basename "$f")" in *debug*|*profile*) continue ;; esac\n    add_file Android "$f"\n  done < <(\n'''
          new='''  while IFS= read -r -d '' f; do\n    add_file Android "$f"\n  done < <(\n'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bash -n "$src"
          ! grep -Fq 'in *debug*|*profile*) continue' "$src"
          grep -Fq -- "-iname '*.apk'" "$src"

          install -m 0755 "$src" "$HOME/bin/fujitsu-nas-artifact-store"
          bash -n "$HOME/bin/fujitsu-nas-artifact-store"

          b64="$(base64 -w0 "$src")"
          jq -n --arg message 'feat: store every fresh Android APK in NAS' --arg content "$b64" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}' > "$RUNNER_TEMP/update.json"
          persisted=0
          for n in 1 2 3 4 5 6; do
            if timeout 60s "${GH[@]}" api --method PUT repos/AbeyyN/X7-Core-Academy/contents/infra/nas-artifacts/collector-v2.sh --input "$RUNNER_TEMP/update.json" >/dev/null; then persisted=1; break; fi
            sleep $((n*3))
          done
          test "$persisted" -eq 1
          echo ALL_APK_POLICY_PERSISTED

      - name: Prove debug-only APK is archived without breaking release preference
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.config/fujitsu-runner/nas-artifacts.env"
          smoke="$RUNNER_TEMP/all-apk-smoke"; rm -rf "$smoke"; mkdir -p "$smoke"
          printf debug > "$smoke/app-debug.apk"
          run="allapk-${GITHUB_RUN_ID}-$(date +%s)"; repo='AbeyyN/__nas-all-apk-smoke__'
          GITHUB_WORKSPACE="$smoke" GITHUB_REPOSITORY="$repo" GITHUB_RUN_ID="$run" GITHUB_JOB=android GITHUB_SHA=x GITHUB_REF_NAME=main GITHUB_REF_TYPE=branch RUNNER_NAME="${RUNNER_NAME:-Fujitsu-PWA-01}" "$HOME/bin/fujitsu-nas-artifact-store" success "$repo" smoke main "$run"
          "$HOME/bin/fujitsu-nas-ssh" -o BatchMode=yes "$PI_USER@$PI_HOST" "CI_ROOT='$CI_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          test -f "$CI_ROOT/Apps/Android/__nas-all-apk-smoke__/latest/app-debug.apk"
          test -f "$CI_ROOT/Apps/Android/__nas-all-apk-smoke__/latest/__nas-all-apk-smoke__-latest.apk"
          rm -rf "$CI_ROOT/Apps/Android/__nas-all-apk-smoke__"
          echo ALL_FRESH_APK_COLLECTION_OK
          REMOTE

      - name: Confirm every Fujitsu registration remains wired
        shell: bash
        run: |
          set -euo pipefail
          count=0; bad=0
          for d in "$HOME"/actions-runner/*; do
            [ -f "$d/.runner" ] || continue
            count=$((count+1))
            grep -q '^ACTIONS_RUNNER_HOOK_JOB_COMPLETED=.*/fujitsu-job-completed.sh$' "$d/.env" || bad=$((bad+1))
          done
          echo "RUNNERS=$count BAD=$bad"
          test "$count" -eq 10
          test "$bad" -eq 0
          echo UNIVERSAL_ALL_APK_WIRING_READY
